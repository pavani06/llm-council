# Conselho de LLMs — configuracao unica.
# Verifique os ids reais da sua conta com:  ./council models
# Precos abaixo sao referencia de ago/2026 (USD por 1M tokens), so para calibrar custo.

[providers.openai]
base_url         = "https://api.openai.com/v1"
api_key_env      = "OPENAI_API_KEY"
# Os gpt-5.6 renomearam o teto e fixaram a temperatura. Declarado aqui porque
# descobrir por 400 custava 3 idas-e-voltas em TODA chamada (medido nos registros).
max_tokens_field = "max_completion_tokens"
unsupported      = ["temperature"]

[providers.deepseek]
base_url    = "https://api.deepseek.com/v1"
api_key_env = "DEEPSEEK_API_KEY"

[providers.anthropic]
# Messages API — NAO e OpenAI-compativel; o adaptador cuida da traducao.
base_url     = "https://api.anthropic.com"
api_key_env  = "CLAUDE_API_KEY"
api          = "anthropic"
known_models = ["claude-opus-5", "claude-sonnet-5", "claude-haiku-4-5"]

[providers.zai]
# GLM Coding Plan (assinatura), nao a API avulsa. A avulsa seria /api/paas/v4.
# Atencao: cada pergunta ao conselho gasta 2 chamadas GLM (resposta + avaliacao)
# da cota trimestral do plano.
base_url     = "https://api.z.ai/api/coding/paas/v4"
api_key_env  = "ZAI_API_KEY"
known_models = ["glm-5.3", "glm-5-turbo", "glm-4.7"]  # liberados no coding plan

# --- conselheiros -------------------------------------------------------
# Diversidade de familia e o que faz o conselho valer: tres modelos do mesmo
# treinador erram junto e o ranqueamento vira teatro.

[[council]]
name     = "gpt"        # openai gpt-5.6-terra: $2 in / $12 out
provider = "openai"
model    = "gpt-5.6-terra"

[[council]]
name     = "deepseek"   # deepseek-v4-pro: $0.66 in / $1.98 out (metade fora de pico)
provider = "deepseek"
model    = "deepseek-v4-pro"
# Modelo de raciocinio: mediu-se 4597 tokens de saida so para uma cedula de 3
# candidatos, e 9838 numa pergunta densa. Coberto pelo teto global.

[[council]]
name     = "claude"     # claude-opus-5: $5 in / $25 out
provider = "anthropic"
model    = "claude-opus-5"
# temperature fica de fora de proposito: o Opus 5 devolve 400 se ela vier.
# O thinking adaptativo (ligado por padrao) consome do mesmo teto; mediu-se 7154
# tokens de saida numa pergunta densa. Coberto pelo teto global.

[[council]]
name     = "glm"        # z.ai glm-5.3: $1.4 in / $4.4 out
provider = "zai"
model    = "glm-5.3"
# Modelo de raciocinio. Ja gastou 8192 inteiros so raciocinando, sem emitir texto;
# com folga fecha em 11488. Coberto pelo teto global.

# --- presidente ---------------------------------------------------------
# De proposito FORA do conselho: quem sintetiza nao deve estar julgando a
# propria resposta. Troque por outro provedor se quiser ainda mais distancia.

[chairman]
name     = "presidente"
provider = "openai"
model    = "gpt-5.6-sol"   # $4 in / $20 out

# --- perfis de deliberacao ----------------------------------------------
# O custo por pergunta vale para os perfis tambem: 2 chamadas GLM por questao
# (resposta + avaliacao) saem da cota trimestral do coding plan.

[profiles.continuation]
# Proximo passo apos a execucao de uma issue/tarefa dentro de um plano.
# Use: council deliberate "qual o proximo passo?" --profile continuation
#        --bundle <resumo da execucao> [--ref <sha da deliberacao anterior>]
chairman_mode = "decider"
stage1_format = "proposal"
criteria = [
    "aderencia a trajetoria do plano",
    "risco do passo e custo de reversao",
    "dependencias que o passo bloqueia ou desbloqueia",
    "sustentacao na evidencia do bundle",
]
# glm fica SEM papel de proposito: contraponto neutro.
[profiles.continuation.roles]
gpt      = "continuador: otimize o progresso da trajetoria do plano"
claude   = "auditor: questione se a evidencia do bundle sustenta o que a execucao afirma"
deepseek = "guardiao de escopo: questione se o passo proposto pertence ao plano"

[profiles.grill]
# Rodada de interrogatorio: questoes ranqueadas por load-bearingness.
# Use: council deliberate "<plano em pauta>" --profile grill --bundle <contexto>
chairman_mode = "synthesizer"
stage1_format = "questions"
criteria = [
    "load-bearingness: quanto a resposta mudaria o plano",
    "decidibilidade: e decisao do operador, nao fato buscavel",
    "especificidade: nomeia o trade-off em jogo",
    "urgencia: bloqueia a fronteira atual de decisoes",
]
[profiles.grill.roles]
gpt      = "cetico metodologico: ataque a validade do metodo e da amostra"
claude   = "cacador de premissa load-bearing: ache a premissa que, se cair, derruba o plano"
deepseek = "mapeador de dependencias: ache decisoes travadas por decisoes ainda abertas"
glm      = "adversario de escopo: questione o que nao pertence ao problema"

# --- ajustes ------------------------------------------------------------

[settings]
exclude_self_rank   = true   # ninguem ranqueia a propria resposta
blind_chairman      = true   # o presidente nao ve marca, so o conteudo e o consenso
shuffle_labels      = true   # ordem A/B/C diferente por avaliador, mata vies de posicao
temperature         = 0.3
# Teto e limite, nao consumo: numa pergunta simples o conselho fecha em ~300-1400
# tokens por membro. So paga quem usar.
max_tokens          = 50000
chairman_max_tokens = 50000
# O timeout PRECISA acompanhar o teto: nas taxas medidas (42-66 tok/s) uma geracao
# de 50k tokens leva 13-20 min. Com os 180s antigos, o teto novo seria decorativo —
# a chamada morreria antes. Contrapartida: um provedor travado agora segura a rodada
# por ate 20 min em vez de 3.
timeout             = 1200.0
retries             = 2
seed                = 0      # 0 = sorteia por execucao e registra; fixe para reproduzir
runs_dir            = "runs"
